<p class="fulltext">When we were children our papas were stout</p>

<p class="fulltext">And colorless as seaweed or the floats</p>

<p class="fulltext">At anchor off New Bedford. We were shut</p>

<p class="fulltext">In gardens where our brassy sailor coats …</p>
