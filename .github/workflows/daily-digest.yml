name: Daily AI Digest

on:
  schedule:
    # Nominally 06:00 Asia/Taipei. GitHub's scheduler is best-effort and
    # busiest on the hour, so this fires late every time — 13 runs measured in
    # September 2026 were 1h27m to 2h57m behind, clustering around 23:40 UTC
    # (≈07:40 Taipei). Moving off the hour (e.g. "37 21 * * *") usually helps.
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate digest
        id: digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m digest.main

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs .digest-state
          # The digest stamps itself in config.yaml's timezone; `date -u` here
          # would label a 22:00 UTC run with the previous day.
          DIGEST_DATE="${{ steps.digest.outputs.date }}"
          git diff --cached --quiet || git commit -m "chore: update daily digest ${DIGEST_DATE:-$(date -u +%F)}"
          git push
