name: Tests

on:
  pull_request:
  push:
    branches: [main]
    # The daily digest commits only generated output; skip a test run for those.
    paths-ignore:
      - "docs/**"
      - ".digest-state/**"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
